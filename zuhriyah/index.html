<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zuhriyah Institut - Workshop Digital (26-27 September 2026)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- MQTT.js via CDN untuk Remote Sync HP -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-deep: #022047;
      --bg-main: #03306b;
      --bg-card: rgba(0, 74, 173, 0.35);
      --bg-card-hover: rgba(0, 74, 173, 0.55);
      --border-card: rgba(56, 189, 248, 0.3);
      --border-glow: rgba(56, 189, 248, 0.6);
      --accent-gold: #f6b50c;
      --accent-gold-glow: rgba(246, 181, 12, 0.4);
      --accent-cyan: #38bdf8;
      --accent-blue: #004aad;
      --text-white: #ffffff;
      --text-light: #f1f5f9;
      --text-muted: #cbd5e1;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: var(--bg-deep);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Background Geometric Blueprint Theme */
    .bg-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 15% 20%, rgba(0, 74, 173, 0.5) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(246, 181, 12, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(3, 48, 107, 0.8) 0%, #022047 100%);
      z-index: 0;
    }

    /* Blueprint Grid Overlay */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 1;
    }

    /* Header Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(2, 32, 71, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      z-index: 50;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .badge-institute {
      background: linear-gradient(135deg, var(--accent-gold), #d97706);
      color: #022047;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .badge-sync {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #34d399;
    }

    .badge-sync .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Main Slide Stage */
    .stage {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
      padding: 70px 40px 90px 40px;
    }

    .slide-container {
      width: 100%;
      max-width: 1360px;
      height: 100%;
      max-height: 780px;
      aspect-ratio: 16 / 9;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: opacity 0.25s ease, transform 0.25s ease;
      background: rgba(3, 48, 107, 0.4);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .slide-container.fading {
      opacity: 0;
      transform: scale(0.985);
    }

    /* Cover Slide */
    .cover-view {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #03306b;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Slide Content Layout */
    .slide-body {
      width: 100%;
      height: 100%;
      padding: 44px 52px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    /* Slide Header */
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      position: relative;
    }

    .slide-header .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(246, 181, 12, 0.15);
      border: 1px solid rgba(246, 181, 12, 0.4);
      color: var(--accent-gold);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .slide-header h1 {
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slide-header p.subhead {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    /* Bento Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      flex: 1;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      flex: 1;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      flex: 1;
    }

    .grid-split {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 24px;
      flex: 1;
    }

    /* Card Components */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .card:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
      transform: translateY(-2px);
    }

    .card-gold {
      background: rgba(246, 181, 12, 0.08);
      border-color: rgba(246, 181, 12, 0.35);
    }
    .card-gold:hover {
      border-color: var(--accent-gold);
      box-shadow: 0 8px 24px var(--accent-gold-glow);
    }

    .card-cyan {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      flex: 1;
    }

    .card .pill {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-cyan);
      align-self: flex-start;
    }

    /* Comparison Table Style */
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-card);
    }

    .compare-table th {
      background: rgba(0, 74, 173, 0.6);
      color: var(--accent-gold);
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-card);
    }

    .compare-table td {
      background: rgba(3, 48, 107, 0.3);
      padding: 14px 16px;
      font-size: 0.88rem;
      color: var(--text-light);
      border-bottom: 1px solid rgba(56, 189, 248, 0.1);
      line-height: 1.45;
    }

    .compare-table tr:hover td {
      background: rgba(0, 74, 173, 0.35);
    }

    /* Step Timeline Horizontal */
    .step-timeline {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      position: relative;
    }

    .step-item {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .step-item .num {
      width: 32px;
      height: 32px;
      background: var(--accent-gold);
      color: #022047;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .step-item h4 {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .step-item p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Banner Quote Footer */
    .banner-quote {
      margin-top: 20px;
      background: linear-gradient(90deg, rgba(0, 74, 173, 0.5), rgba(246, 181, 12, 0.15));
      border: 1px solid rgba(246, 181, 12, 0.4);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .banner-quote span.icon {
      font-size: 1.6rem;
    }

    .banner-quote p {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fef08a;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(2, 32, 71, 0.9);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
      z-index: 50;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      transform: scale(1.05);
    }

    .page-counter {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent-gold);
      padding: 0 8px;
      min-width: 70px;
      text-align: center;
    }

    /* Thumbnails Drawer */
    .thumb-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 6px;
      max-width: 60%;
    }

    .thumb-strip::-webkit-scrollbar {
      height: 4px;
    }
    .thumb-strip::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.3);
      border-radius: 4px;
    }

    .thumb-btn {
      flex-shrink: 0;
      width: 52px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 74, 173, 0.4);
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .thumb-btn:hover {
      border-color: var(--accent-cyan);
      color: #ffffff;
    }

    .thumb-btn.active {
      background: var(--accent-gold);
      color: #022047;
      border-color: #ffffff;
      box-shadow: 0 0 10px var(--accent-gold-glow);
    }

    /* UI Auto-Hide Class */
    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(20px);
    }
    .top-bar.ui-hidden {
      transform: translateY(-20px);
    }

    /* Click Zones */
    .click-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 12%;
      z-index: 20;
      cursor: pointer;
    }
    .click-zone.left { left: 0; }
    .click-zone.right { right: 0; }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="bg-grid"></div>

  <!-- Top Navigation Header -->
  <header id="top-bar" class="top-bar">
    <div class="brand-title">
      <span class="badge-institute">ZUHRIYAH INSTITUT</span>
      <span>WORKSHOP DIGITAL: Perempuan Cerdas & Kreatif</span>
    </div>
    <div class="badge-sync">
      <span class="dot"></span>
      <span id="remote-status">Remote Sync Aktif</span>
    </div>
  </header>

  <!-- Main Presentation Stage -->
  <main class="stage" id="stage">
    <div class="click-zone left" id="zone-left" title="Klik untuk slide sebelumnya"></div>
    
    <div class="slide-container" id="slide-container">
      <div class="cover-view">
        <img src="cover.jpg" alt="Cover Workshop Digital Zuhriyah Institut" class="cover-img">
      </div>
    </div>

    <div class="click-zone right" id="zone-right" title="Klik untuk slide berikutnya"></div>
  </main>

  <!-- Bottom Control Bar -->
  <footer id="bottom-bar" class="bottom-bar">
    <div class="controls-wrapper">
      <button class="btn-action" id="btn-prev" title="Slide Sebelumnya (Panah Kiri)">◀</button>
      <span class="page-counter" id="counter">1 / 14</span>
      <button class="btn-action" id="btn-next" title="Slide Berikutnya (Panah Kanan / Spasi)">▶</button>
      <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
      <button class="btn-action" id="btn-fs" title="Layar Penuh (F)">⛶</button>
    </div>

    <!-- Thumbnails Strip -->
    <div class="thumb-strip" id="thumb-strip"></div>
  </footer>

    btnFs.onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextPage();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevPage();
      } else if (e.key === 'Home') {
        goToPage(1);
      } else if (e.key === 'End') {
        goToPage(totalPages);
      } else if (e.key.toLowerCase() === 'f') {
        btnFs.click();
      }
      resetHideTimeout();
    });

    // Touch Swipe
    let touchStartX = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      resetHideTimeout();
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) {
        nextPage();
      } else if (touchEndX - touchStartX > 50) {
        prevPage();
      }
    }, { passive: true });

    // UI Auto-Hide
    function resetHideTimeout() {
      topBar.classList.remove('ui-hidden');
      bottomBar.classList.remove('ui-hidden');
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        topBar.classList.add('ui-hidden');
        bottomBar.classList.add('ui-hidden');
      }, 3500);
    }

    window.addEventListener('mousemove', resetHideTimeout);
    resetHideTimeout();

    // ==========================================
    // CLOUD MQTT REMOTE SYNC (AV MASTER CONTROL)
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const CHANNEL_ID = urlParams.get('channel') || localStorage.getItem('av_channel_id') || 'ruang-sidang-utama';
    const BROKERS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt'
    ];
    let brokerIdx = 0;
    let mqttClient = null;
    let heartbeatInterval = null;

    function reportStatus() {
      if (mqttClient && mqttClient.connected) {
        const payload = {
          state: 'PROFILE',
          event: 'ZUHRIYAH_WORKSHOP',
          slide: currentPage,
          total: totalPages,
          operator: 'Layar Zuhriyah',
          timestamp: Date.now()
        };
        mqttClient.publish(`avcontrol/${CHANNEL_ID}/status`, JSON.stringify(payload));
      }
    }

    function sendHeartbeat() {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`avcontrol/${CHANNEL_ID}/heartbeat`, JSON.stringify({
          status: 'ALIVE',
          device: 'zuhriyah_presentation',
          slide: currentPage,
          total: totalPages,
          timestamp: Date.now()
        }));
      }
    }

    function connectMQTT() {
      mqttClient = mqtt.connect(BROKERS[brokerIdx], {
        clientId: `zuhriyah_${Date.now().toString(36)}`,
        clean: true,
        keepalive: 15,
        reconnectPeriod: 2000,
        connectTimeout: 5000
      });

      mqttClient.on('connect', () => {
        remoteStatus.textContent = `Remote HP Terhubung (${CHANNEL_ID})`;
        mqttClient.subscribe(`avcontrol/${CHANNEL_ID}/command`);
        reportStatus();
        sendHeartbeat();
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        heartbeatInterval = setInterval(sendHeartbeat, 2000);
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (data.target === 'NEXT_SLIDE') {
            nextPage();
          } else if (data.target === 'PREV_SLIDE') {
            prevPage();
          } else if (data.target === 'ZOOM') {
            // Simpan slide terakhir sebelum beralih ke Zoom
            lastSlideBeforeZoom = currentPage;
          } else if (data.target === 'PROFILE') {
            // Jika switch dari Zoom ke Slide: otomatis tampilkan slide terakhir + 1
            if (lastSlideBeforeZoom !== null) {
              const targetPage = Math.min(totalPages, lastSlideBeforeZoom + 1);
              goToPage(targetPage);
            } else {
              goToPage(1);
            }
          }
        } catch (e) {
          console.error('MQTT error:', e);
        }
      });

      mqttClient.on('error', () => {
        brokerIdx = (brokerIdx + 1) % BROKERS.length;
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        setTimeout(connectMQTT, 2500);
      });

      mqttClient.on('close', () => {
        remoteStatus.textContent = 'Menghubungkan Ulang...';
      });
    }

    // Inisialisasi Tampilan
    goToPage(1);
    connectMQTT();
  </script>
</body>
</html>
